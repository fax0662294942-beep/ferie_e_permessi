name: Ferie Permessi Native CI
on:
  workflow_dispatch:
  push:
    branches: [ android-native, 'candidate/**' ]
  pull_request:
    branches: [ android-native ]
concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - name: Retain the development-only debug certificate
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/debug.keystore
            ~/.config/.android/debug.keystore
          key: ferie-permessi-native-debug-certificate-v2
      - name: Validate Firebase Android configuration
        run: python3 tools/verify-firebase-config.py
      - name: Unit tests and lint
        run: gradle :app:testDebugUnitTest :app:lintDebug
      - name: Build debug APK
        run: |
          gradle :app:assembleDebug
          gradle :app:signingReport | tee app/build/outputs/apk/debug/signing-report.txt
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APK_SIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/apk-certificate.txt
          python3 tools/verify-firebase-config.py --certificate-report app/build/outputs/apk/debug/apk-certificate.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FeriePermessiNative-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/signing-report.txt
            app/build/outputs/apk/debug/apk-certificate.txt
            app/build/outputs/apk/debug/apk-sha256.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Room-schemas
          path: app/schemas
          if-no-files-found: error
  emulator:
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install Firebase emulator CLI
        run: npm install --global firebase-tools@14.18.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: firebase emulators:exec --only auth,firestore --project demo-feriepermessi --config firebase-test.json "gradle :app:connectedDebugAndroidTest"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumentation-results-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            firebase-debug.log
            firestore-debug.log
